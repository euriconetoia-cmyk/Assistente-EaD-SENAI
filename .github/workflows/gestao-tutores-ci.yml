name: Gestao Tutores CI

on:
  pull_request:
    paths:
      - 'gestao-tutores-extension/**'
      - '.github/workflows/gestao-tutores-ci.yml'
  push:
    branches:
      - 'agent/gestao-tutores-v3'
    paths:
      - 'gestao-tutores-extension/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao-tutores-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gestao-tutores-extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax
        run: npm run check:syntax
      - name: Tests
        run: npm test
