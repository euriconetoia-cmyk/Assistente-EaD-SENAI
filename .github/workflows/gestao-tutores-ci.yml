name: Gestao Tutores CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gestao-tutores-extension/**'
      - '.github/workflows/gestao-tutores-ci.yml'
  push:
    branches:
      - 'agent/gestao-tutores-v3'
    paths:
      - 'gestao-tutores-extension/**'
      - '.github/workflows/gestao-tutores-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao-tutores-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax
        run: npm run check:syntax
      - name: Tests
        run: npm test
      - name: Build beta artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestao-tutores-moodle-senai-v0.4-beta
          path: gestao-tutores-extension
          if-no-files-found: error
          retention-days: 7
