name: Importar pacote completo do projeto

on:
  push:
    paths:
      - '.upload/READY'
      - '.upload/part-*'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir pacote ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part-* | base64 --decode > /tmp/assistente-ead-senai.zip
          echo "d07357e75a405df36cd9339a8e44d5c8184346cccb3ce956b62753d66ad2464b  /tmp/assistente-ead-senai.zip" | sha256sum --check

      - name: Extrair estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/assistente-ead-senai
          unzip -q /tmp/assistente-ead-senai.zip -d /tmp/assistente-ead-senai
          rsync -a /tmp/assistente-ead-senai/Assistente-Tutor-SENAI-v3.0.0/ ./
          rm -rf .upload
          rm -f .github/workflows/import-project.yml

      - name: Registrar versão 3.0.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
            exit 0
          fi
          git commit -m "feat: importa Assistente EaD SENAI v3.0.0 completo"
          git push
